<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Admin Panel - Quản lý sách</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/kiwi.png" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet"
    />
    <link th:href="@{/assets/css/styles.css}" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<!-- Sidebar -->
<button id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
<div class="sidebar">
    <ul>
        <li>
            <a th:href="@{/}"><i class="fas fa-home"></i><span>Trang Chủ</span></a>
        </li>
        <li>
            <a th:href="@{/story/add}"><i class="fas fa-book"></i><span>Thêm câu chuyện</span></a>
        </li>
        <li>
            <a th:href="@{/category/cate}"><i class="fas fa-list-alt"></i><span>Quản lý danh mục</span></a>
        </li>
        <li>
            <a th:href="@{/}"><i class="fas fa-cog"></i><span>Cài Đặt</span></a>
        </li>
        <li>
            <a th:href="@{/}"
            ><i class="fas fa-sign-out-alt"></i><span>Đăng Xuất</span></a
            >
        </li>
    </ul>
</div>

<!-- Header -->
<div class="header">
    <form th:action="@{/story/search}" method="GET">
        <input
                type="text"
                name="name"
                placeholder="Tìm kiếm sách..."
                class="search-bar"
        />
        <button type="submit" class="search-button">
            <i class="fas fa-search"></i>
        </button>
    </form>
</div>
<!-- Main Content -->
<div class="content">
    <button class="btn btn-primary">
        <a th:href="@{/category/addcate}" style="color: white; text-decoration: none;">Thêm danh mục mới</a>
    </button>
    <table class="book-list-table">
        <thead>
        <tr>
            <th>Ảnh đại diện danh mục</th>
            <th>ID danh mục</th>
            <th>Tên danh mục</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s: ${categorystories}">
            <td>
                <img th:src="@{|${s.mCateAvatarUrl}|}" class="book-image" alt="#"/>
            </td>
            <td>[[${s.mCateId}]]</td>
            <td>[[${s.mCateName['vi']}]]</td>
            <td>
                <a th:href="@{|/category/detailcate/${s._id}|}" class="btn btn-sm btn-primary">Chỉnh sửa</a>
                                <form th:action="@{|/category/deletecate/${s._id}|}" method="post" style="display:inline;">
                                    <input type="hidden" name="_method" value="DELETE" />
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa câu chuyện này?');">Xóa</button>
                                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script>document
        .getElementById("toggleSidebarBtn")
        .addEventListener("click", function () {
          document.querySelector(".sidebar").classList.toggle("hidden");
          document.querySelector(".content").classList.toggle("collapsed");
  });
</script>
</body>
</html>
