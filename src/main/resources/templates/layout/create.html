<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Admin Panel - Quản lý sách</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/kiwi.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/assets/css/styles.css}" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <!-- Sidebar -->
    <button id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
    <div class="sidebar">
      <ul>
        <li>
          <a th:href="@{/}"><i class="fas fa-home"></i><span>Trang Chủ</span></a>
        </li>
        <li>
          <a th:href="@{/story/add}"><i class="fas fa-book"></i><span>Thêm câu chuyện</span></a>
        </li>
        <li>
          <a th:href="@{/}"><i class="fas fa-list-alt"></i><span>Quản lý danh mục</span></a>
        </li>
        <li>
          <a th:href="@{/}"><i class="fas fa-cog"></i><span>Cài Đặt</span></a>
        </li>
        <li>
          <a th:href="@{/}"
            ><i class="fas fa-sign-out-alt"></i><span>Đăng Xuất</span></a
          >
        </li>
      </ul>
    </div>

    <!-- Header -->
    <div class="header">
      <form th:action="@{/story/search}" method="GET">
        <input
          type="text"
          name="name"
          placeholder="Tìm kiếm sách..."
          class="search-bar"
        />
        <button type="submit" class="search-button">
          <i class="fas fa-search"></i>
        </button>
      </form>
    </div>
    <!-- Main Content -->
    <div class="content">
      <h2>Thêm Câu Chuyện Mới</h2>
      <form th:action="@{/story/add}" method="post" class="form-group">
        <div class="mb-3">
          <label for="mStoryName">Tên câu chuyện:</label>
          <textarea id="mStoryName" name="mStoryName" class="form-control" rows="5" placeholder='Nhập tên câu chuyện'></textarea>
        </div>
        <div class="mb-3">
          <label for="mStoryData">Nội dung câu chuyện:</label>
          <textarea id="mStoryData" name="mStoryData" class="form-control" rows="10" placeholder='Nhập dữ liệu câu chuyện'></textarea>
        </div>
        <div class="mb-3">
          <label for="mCateId" class="form-label">Chọn câu chuyện</label>
          <select id="mCateId" name="mCateId" class="form-control">
            <option value="Chọn"></option>
            <option value="CATE00000000001">CATE00000000001</option>
            <option value="CATE00000000002">CATE00000000002</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="mStoryAvatarUrl">URL Ảnh đại diện câu chuyện:</label>
          <input
                  type="text"
                  id="mStoryAvatarUrl"
                  name="mStoryAvatarUrl"
                  class="form-control"
                  placeholder="Nhập URL ảnh đại diện"
          />
        </div>
        <div class="mb-3">
          <label for="areaStory" class="form-label">Area Story</label>
          <select id="areaStory" name="areaStory" class="form-control" >
            <option value="Chọn"></option>
            <option value="Việt Nam">Việt Nam</option>
            <option value="English">English</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
    <script>document
        .getElementById("toggleSidebarBtn")
        .addEventListener("click", function () {
          document.querySelector(".sidebar").classList.toggle("hidden");
          document.querySelector(".content").classList.toggle("collapsed");
  });
    </script>
  </body>
</html>
