<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Admin Panel - Quản lý sách</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/kiwi.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/assets/css/styles.css}" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li>
          <a th:href="@{/}"><i class="fas fa-home"></i><span>Trang Chủ</span></a>
        </li>
        <li>
          <a th:href="@{/story/add}"><i class="fas fa-home"></i><span>Thêm câu chuyện</span></a>
        </li>
        <li>
          <a th:href="@{/}"><i class="fas fa-home"></i><span>Quản lý danh mục</span></a>
        </li>
        <li>
          <a th:href="@{/}"><i class="fas fa-cog"></i><span>Cài Đặt</span></a>
        </li>
        <li>
          <a th:href="@{/}"
            ><i class="fas fa-sign-out-alt"></i><span>Đăng Xuất</span></a
          >
        </li>
      </ul>
    </div>

    <!-- Header -->
    <div class="header">
      <form th:action="@{/story/search}" method="GET">
        <input
          type="text"
          name="name"
          placeholder="Tìm kiếm sách..."
          class="search-bar"
        />
        <button type="submit" class="search-button">
          <i class="fas fa-search"></i>
        </button>
      </form>
    </div>
    <!-- Main Content -->
    <div class="container-fluid p-4">
      <!-- Hiển thị chi tiết sách -->
      <div class="card mb-4" th:object="${stories}">
        <div class="card-header">Thêm sách mới</div>
        <div class="card-body">
          <form th:action="@{/story/add}" method="POST">
            <div class="row">
              <div class="col-6">
                <div class="mb-3">
                  <label for="mStoryData" class="form-label"
                    >Nội dung câu chuyện(18 ngôn ngữ)</label
                  >
                  <textarea
                    th:field="*{mStoryData}"
                    class="form-control"
                    id="mStoryData"
                    cols="100"
                    rows="15"
                    required
                  ></textarea>
                </div>
              </div>
              <div class="col-6">
                <div class="mb-3">
                  <label for="mStoryName" class="form-label"
                    >Tên câu chuyện(18 ngôn ngữ)</label
                  >
                  <textarea
                    th:field="*{mStoryName}"
                    class="form-control"
                    id="mStoryName"
                    cols="100"
                    rows="15"
                    required
                  ></textarea>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label for="mCateId" class="form-label">Chọn câu chuyện</label>
              <select th:field="*{mCateId}" class="form-control" id="mCateId">
                <option value="Chọn"></option>
                <option value="CATE00000000001">CATE00000000001</option>
                <option value="CATE00000000002">CATE00000000002</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="mStoryAvatarUrl" class="form-label"
                >Đường dẫn ảnh đại diện</label
              >
              <input
                th:field="*{mStoryAvatarUrl}"
                type="text"
                class="form-control"
                id="mStoryAvatarUrl"
              />
            </div>
            <div class="mb-3">
              <label for="areaStory" class="form-label">Area Story</label>
              <select
                th:field="*{areaStory}"
                class="form-control"
                id="areaStory"
              >
                <option value="Chọn"></option>
                <option value="Việt Nam">Việt Nam</option>
                <option value="English">English</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Thêm mới</button>
          </form>
        </div>
      </div>
    </div>

    <script src="/assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
