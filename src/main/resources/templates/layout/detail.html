<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Admin Panel - Quản lý sách</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/kiwi.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/assets/css/styles.css}" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
  <!-- Sidebar -->
  <button id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
  <div class="sidebar">
    <ul>
      <li>
        <a th:href="@{/}"><i class="fas fa-home"></i><span>Trang Chủ</span></a>
      </li>
      <li>
        <a th:href="@{/story/add}"><i class="fas fa-book"></i><span>Thêm câu chuyện</span></a>
      </li>
      <li>
        <a th:href="@{/category/cate}"><i class="fas fa-list-alt"></i><span>Quản lý danh mục</span></a>
      </li>
      <li>
        <a th:href="@{/}"><i class="fas fa-cog"></i><span>Cài Đặt</span></a>
      </li>
      <li>
        <a th:href="@{/}"
        ><i class="fas fa-sign-out-alt"></i><span>Đăng Xuất</span></a
        >
      </li>
    </ul>
  </div>

  <!-- Header -->
  <div class="header">
    <form th:action="@{/story/search}" method="GET">
      <input type="text" name ="name" placeholder="Tìm kiếm sách..." class="search-bar" />
      <button type="submit" class="search-button">
        <i class="fas fa-search"></i>
      </button>
    </form>
  </div>
        <!-- Main Content -->
        <div class="content">
          <!-- Hiển thị chi tiết sách -->
          <div class="card mb-4" th:object="${stories}">
            <div class="card-header">Thông tin chi tiết sách</div>
            <div class="card-body">
              <form th:action="@{/story/update/{id}(id=${stories._id})}" method="post" class="form-group">
                <input type="hidden" name="_method" value="PATCH">
                <div class="mb-3">
                  <label for="mStoryId">ID câu chuyện</label>
                  <input type="text" id="mStoryId" name="mStoryId" class="form-control" th:value="${stories.mStoryId}" placeholder="Nhập ID câu chuyện"/>
                </div>
                <div class="mb-3">
                  <label for="mStoryName">Tên câu chuyện:</label>
                  <textarea id="mStoryName" name="mStoryName" class="form-control" rows="10" th:utext="${mStoryNameJson}" placeholder="Nhập tên câu chuyện"></textarea>
                </div>
                <div class="mb-3">
                  <label for="mStoryData">Nội dung câu chuyện:</label>
                  <textarea id="mStoryData" name="mStoryData" class="form-control" rows="10" th:utext="${mStoryDataJson}" placeholder="Nhập dữ liệu câu chuyện"></textarea>
                </div>
                <div class="mb-3">
                  <label for="mCateId" class="form-label">Câu chuyện</label>
<!--                  <input type="text" id="mCateId" name="mCateId" class="form-control" th:value="${stories.mCateId}" placeholder="Nhập ID câu chuyện"/>-->
                  <select id="mCateId" name="mCateId" class="form-control">
                    <option value="" th:text="'Chọn câu chuyện'">Chọn câu chuyện</option>
                    <option th:value="${stories.mCateId}" th:text="${stories.mCateId}" th:selected="${stories.mCateId}"></option>
                    <option th:each="category : ${categorystories}" th:value="${category.mCateId}" th:text="${category.mCateId}"></option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="mStoryAvatarUrl">URL Ảnh đại diện câu chuyện:</label>
                  <input type="text" id="mStoryAvatarUrl" name="mStoryAvatarUrl" class="form-control" th:value="${stories.mStoryAvatarUrl}" placeholder="Nhập URL ảnh đại diện"/>
                </div>
                <div class="mb-3">
                  <label for="areaStory" class="form-label">Area Story</label>
                  <select id="areaStory" name="areaStory" class="form-control" >
                    <option value="" th:text="'Chọn'" th:if="${stories.areaStory == null}"></option>
                    <option value="Việt Nam" th:selected="${stories.areaStory == 'Việt Nam'}">Việt Nam</option>
                    <option value="English" th:selected="${stories.areaStory == 'English'}">English</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary">Cập nhật</button>
              </form>
            </div>
          </div>
        </div>
  <script>document
    .getElementById("toggleSidebarBtn")
    .addEventListener("click", function () {
      document.querySelector(".sidebar").classList.toggle("hidden");
      document.querySelector(".content").classList.toggle("collapsed");
    });
  </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
